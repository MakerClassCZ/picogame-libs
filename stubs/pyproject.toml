[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "picogame-stubs"
version = "0.1.31"
description = "Type stubs for the picogame native module (CircuitPython 2D game engine) - editor autocomplete/typing for pylance, mypy, pyright."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = ["Typing :: Stubs Only", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://picogame.makerclass.cz"
Source = "https://github.com/MakerClassCZ/picogame-libs"

[tool.setuptools]
packages = ["picogame-stubs"]
include-package-data = true

[tool.setuptools.package-data]
"picogame-stubs" = ["*.pyi", "py.typed"]
